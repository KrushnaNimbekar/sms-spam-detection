<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SMS Spam Detector</title>

<style>
    /* ===== Global ===== */
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
        background: linear-gradient(135deg, #e9ecef, #f8f9fa);
    }

    /* ===== Glass Card ===== */
    .card {
        width: 420px;
        padding: 30px;
        border-radius: 20px;

        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);

        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
        font-weight: 600;
        color: #2c2c2c;
    }

    textarea {
        width: 100%;
        height: 120px;
        padding: 12px;
        border-radius: 12px;

        border: 1px solid rgba(0,0,0,0.1);
        outline: none;

        resize: none;
        font-size: 14px;

        background: rgba(255,255,255,0.6);
    }

    button {
        margin-top: 15px;
        width: 100%;
        padding: 12px;

        border: none;
        border-radius: 12px;

        background: #2c2c2c;
        color: white;
        font-size: 15px;
        cursor: pointer;

        transition: 0.3s ease;
    }

    button:hover {
        background: #444;
        transform: scale(1.02);
    }

    /* ===== Result ===== */
    .result {
        margin-top: 20px;
        font-size: 16px;
        font-weight: 500;
        color: #333;
    }

    .spam {
        color: #d00000;
    }

    .ham {
        color: #1b9aaa;
    }
</style>

</head>

<body>

<div class="card">

    <h2>📩 SMS Spam Detector</h2>

    <form action="/predict" method="POST">
        <textarea name="message" placeholder="Type your message..."></textarea>
        <button type="submit">Analyze</button>
    </form>

    {% if prediction %}
        <div class="result">
            {{ prediction }}
        </div>
    {% endif %}

</div>

</body>
</html>
